# =============================================================================


[Display]
# Modo de exibição: 0 = Tela Cheia (Fullscreen), 1 = Modo Janela
Display_mode=1

# Forçar resolução: 0 = Não, 1 = Sim
# ATENÇÃO: Ignora a validação do driver de vídeo. Pode resultar em tela preta ou erro de inicialização.
Display_force_resolution=0

# Lista de Resoluções Suportadas (ID):
#  -1=[Manual]    0=[Automático]  1=[640x480]     2=[800x600]     3=[1024x768]
#   4=[1280x720]  5=[1280x800]    6=[1280x960]    7=[1280x1024]   8=[1440x900]
#   9=[1600x900]  10=[1600x1024] 11=[1600x1080]  12=[1920x1200] 13=[1920x1440]
#  14=[2560x1080] 15=[2560x1440] 16=[3440x1440]  17=[3840x2160] 18=[5120x2160]
# DICA: Para usar valores customizados, altere o ID abaixo para -1 e configure
# as opções de largura (width) e altura (height) na seção avançado.
Display_resolution_id=0

# =============================================================================
# SEÇÃO DE CONFIGURAÇÃO MANUAL (MODO AVANÇADO)
# ATENÇÃO: Valores que excedam a área do seu monitor ou menores que 640x480
# serão resetados para o modo [0] Automático por segurança.
# =============================================================================
# --- Ajustes Manuais (Substituem a lista de resoluções acima) ---
# NOTA: Se definidos, o Display_resolution será forçado para -1 (Modo Manual)
# Largura e Altura customizadas: (Ex: 1920 e 1080). Use 0 para desativar o ajuste manual.
#Display_manual_width=0
#Display_manual_height=0
# Profundidade de cor: Escolha entre [16, 24 ou 32] bits (Padrão: 32)
#Display_manual_cBit=32
# Tamanho da fonte da interface: Minimo 1, Máximo 100. Use 0 para escala automática.
#Display_manual_font_size=25

# Restaurar estado da janela: 0 = Desativado, 1 = Ativado
# Se ativado, o aplicativo memoriza a última posição da janela.
# NOTA: Alterar a resolução nativa do monitor/sistema pode causar erros de posicionamento na inicialização.
Display_restore=0

[Informações do client]
TimeToSaveInSeconds=20
Smooth=2
MusicVolume=30
SoundVolume=30
Brightness=57
Cursor=2
PlayDemo=1
UIVer=1
CameraRotate=0
DXT=0
KeyType=0
CameraView=1
SessionId=35567501154737
TextureReleaseTime=3600

# --- Modo de Controle ---
# 1 = Modo Clássico: Sistema original e estável.
# 0 = Modo Dev/Preview: Funções experimentais em desenvolvimento para avaliação técnica.
# NOTA: O modo Preview pode conter mecânicas diferentes do original para testes de novas funcionalidades.
Control_classic=1
Control_maxChatHistory=15
Control_maxWhisperHistory=15
